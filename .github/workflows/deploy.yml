name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  npm-audit:
    name: Analisis de Vulnerabilidades (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar npm audit
        run: npm audit --audit-level=high

  trivy-scan:
    name: Escaneo de Imagen (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Build imagen local para escaneo
        run: docker build -t api-fortaleza-nube:scan .

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-fortaleza-nube:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  deploy:
    name: Build, Push y Despliegue
    needs: [npm-audit, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-fortaleza-nube:latest

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/api-fortaleza-nube:latest
            docker stop api-fortaleza-nube || true
            docker rm api-fortaleza-nube || true
            docker run -d --name api-fortaleza-nube --restart always -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/api-fortaleza-nube:latest